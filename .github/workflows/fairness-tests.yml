# .github/workflows/fairness-tests.yml
name: Fairness Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fairness-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run fairness test suite
        run: pytest tests/ -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fairness-results
          path: tests/results.json